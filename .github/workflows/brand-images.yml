name: Brand images

# Regenerates docs/assets/ (the mark, wordmarks, README hero and gallery, thumbnail strip and social
# preview) with bin/brand-images on the pinned golden image (ubuntu-24.04, the same packages as
# goldens.yml) and uploads it as an artifact to commit. Run by hand:
#   gh workflow run brand-images.yml --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libvips and fonts
        run: sudo apt-get update && sudo apt-get install -y libvips-dev fonts-noto-color-emoji fonts-noto-cjk
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Versions
        run: |
          bundle exec ruby -rvips -e 'puts "libvips #{Vips.version_string}, ruby-vips #{Vips::VERSION}"'
      - run: bundle exec bin/brand-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-images
          path: docs/assets/
          if-no-files-found: error
          retention-days: 7
