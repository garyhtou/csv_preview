name: Goldens

# Regenerates test/golden/ on the pinned image (ubuntu-24.04, libvips 8.15.1) and uploads it as an
# artifact. Run by hand: gh workflow run goldens.yml --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libvips and fonts
        run: sudo apt-get update && sudo apt-get install -y libvips-dev fonts-noto-color-emoji fonts-noto-cjk
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec bin/goldens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goldens
          path: test/golden/*
          retention-days: 7
