name: Release

# Publishes the gem to RubyGems.org when a v* tag is pushed (branding-and-discoverability.md 5.4).
# Trusted publishing exchanges a short-lived GitHub OIDC token for a push-only RubyGems credential, so no
# API key exists anywhere, and rubygems/release-gem uploads Sigstore attestations with the gem. The job
# runs in the protected "release" environment, whose required reviewer is the maintainer, so a tag
# alone cannot publish. One-time setup before the first tag: create the "release" environment with a
# required reviewer, and a pending trusted publisher on RubyGems.org for this repository, workflow
# release.yml and environment release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read # the tag already exists, so rake release pushes nothing to GitHub
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ruby
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version="$(ruby -Ilib -rcsv_preview/version -e 'print CsvPreview::VERSION')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CsvPreview::VERSION $version" >&2
            exit 1
          fi
      # Trusted publishing, done here instead of by release-gem's own credentials step: RubyGems.org
      # only creates a new gem from a pending trusted publisher if the token exchange names the
      # account that will own it, and no released rubygems/configure-rubygems-credentials (v2.1.0)
      # sends that `owner` field yet. This is the same exchange and the same credential setup that
      # action performs, plus `owner`. The key it returns can only push, and expires in 15 minutes.
      # Switch back to release-gem's built-in step once it supports an owner input.
      - name: Exchange the GitHub OIDC token for a RubyGems push key
        env:
          RUBYGEMS_OWNER: "173790" # the maintainer's RubyGems.org account ID (public, not a secret)
        run: |
          set -euo pipefail
          jwt="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -er .value)"
          echo "::add-mask::$jwt"
          response="$(JWT="$jwt" jq -n --arg owner "$RUBYGEMS_OWNER" '{jwt: env.JWT, owner: $owner}' \
            | curl -sS --fail-with-body -X POST --data @- \
                -H "Content-Type: application/json" -H "Accept: application/json" \
                https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token)" \
            || { echo "Token exchange failed: $response" >&2; exit 1; }
          key="$(printf '%s' "$response" | jq -r '.rubygems_api_key // empty')"
          if [ -z "$key" ]; then
            echo "Token exchange returned no key" >&2
            exit 1
          fi
          echo "::add-mask::$key"
          if [[ ! "$key" =~ ^rubygems_[0-9a-f]+$ ]]; then
            echo "Token exchange returned a key in an unexpected format" >&2
            exit 1
          fi
          {
            echo "GEM_HOST_API_KEY=$key"
            echo "RUBYGEMS_API_KEY=$key"
            echo "BUNDLE_GEM__PUSH_KEY=$key"
          } >> "$GITHUB_ENV"
          umask 077
          mkdir -p ~/.gem
          printf -- '---\n:rubygems_api_key: %s\n' "$key" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          echo "Push key issued for owner $(printf '%s' "$response" | jq -r '.owner // "unknown"'), expires $(printf '%s' "$response" | jq -r .expires_at)"
      - uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
        with:
          setup-trusted-publisher: false
